spring.application.name=radar

# Puertos propios: manuales-modulo usa 8080/8100/5173, Monetizacion 8081/8101/5174,
# este modulo 8082/8102/5175.
server.port=8082

# ── Datos ────────────────────────────────────────────────────────────
# Carpeta del modulo: la base SQLite.
radar.datos=./datos

spring.datasource.url=jdbc:sqlite:${radar.datos}/radar.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor: pocas conexiones y WAL para leer mientras se escribe.
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:bd/01_ESQUEMA.sql

# Worker (Apify, Gemini, informe). No se expone.
radar.worker=http://localhost:8102

# Origenes del navegador admitidos (Vite en desarrollo).
radar.origenes-permitidos=http://localhost:5175

# Los informes con imagenes y anuncios pesan varios MB; el video de una publicacion, hasta 100 MB.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info
